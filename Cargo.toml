[package]
name = "opensearch-compat-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
bytes = "1"
futures-util = "0.3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
